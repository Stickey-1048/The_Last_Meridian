# Portable checks: consistency and simulation only.
#
# Runs tools/run_checks.sh, as it is, on a GitHub-hosted Linux machine with
# Python 3 and the .NET 8 SDK. That script needs no game: it runs the logic
# model's tests, builds the plugin and reads it back, cross-checks scripts,
# plugin and model, builds against generated stand-in masters, and runs the
# project's Papyrus sources in the project's own stand-in for the game,
# replaying every game run on record.
#
# A green run means the design is internally consistent.
# It is NOT a Papyrus compile (the compiler ships with the game and is not
# here), NOT a load in Fallout 4, and NOT a test of anything as a player
# meets it. Those happen on a PC with the game (docs/design/TEST_RUNBOOK.md)
# and are recorded in docs/design/VERIFY_LOG.md.
#
# The job has no secrets, no write access, no deployment and no release. It
# uses no game files: the masters it builds against are generated by
# tools/StandInMaster.
name: "Portable checks (consistency and simulation only; no Papyrus compile, no game)"

on:
  pull_request:
  push:
    branches:
      - main
      - feat/tlm-mq01-graybox
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-checks:
    name: "tools/run_checks.sh (not a compile, not a game test)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      # The whole history, not the last commit: the replay of the recorded
      # game runs reads the scripts as they were at each run's commit, and
      # skips a run whose commit it cannot find.
      - name: Check out the repository with its history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: The commits of the recorded game runs are in this copy
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::The checkout is shallow; the recorded game runs could not all be replayed."
            exit 1
          fi
          python3 - <<'PY'
          import json, subprocess, sys
          runs = json.load(open("tools/papyrus_sim/game_runs.json"))["runs"]
          missing = [c for c in sorted({r["commit"] for r in runs})
                     if subprocess.run(["git", "cat-file", "-e", c + "^{commit}"]).returncode != 0]
          if missing:
              print("::error::Commits of recorded game runs are not in this copy: " + ", ".join(missing))
              sys.exit(1)
          print("%d recorded game runs, every commit present" % len(runs))
          PY

      - name: tools/run_checks.sh
        run: |
          set -euo pipefail
          tools/run_checks.sh 2>&1 | tee "$RUNNER_TEMP/run_checks.log"

      # The script passes when a test is skipped. In the stand-in engine's
      # tests a skip means a commit was not found, which is a run not
      # replayed: here that is a failure. (The logic model skips the rows of
      # the matrices that only the game can answer; that is as intended.)
      - name: No recorded game run was left out of the replay
        run: |
          set -euo pipefail
          verdict="$(awk '/^== 5\/5 /{on=1} on' "$RUNNER_TEMP/run_checks.log" | grep -m1 -E '^(OK|FAILED)' || true)"
          echo "stand-in engine tests: ${verdict:-no verdict line found}"
          if [ "$verdict" != "OK" ]; then
            echo "::error::The stand-in engine's tests did not all run: '${verdict:-no verdict line}'."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Portable checks: consistency and simulation only"
            echo
            echo "Commit \`${GITHUB_SHA}\`. Job status: **${{ job.status }}**."
            echo
            echo "What ran: \`tools/run_checks.sh\`, unchanged, on a GitHub-hosted Linux machine with Python 3 and the .NET 8 SDK."
            echo
            echo "**What a green run means:** the logic model, the Papyrus sources and the plugin specification agree with one another, the plugin builds and reads back, and the scripts behave in the project's stand-in engine as the recorded game runs did."
            echo
            echo "**What it does not mean:** nothing was compiled by the Papyrus compiler, nothing was loaded by Fallout 4, and nothing was played. No game files, secrets or credentials are used. Game results are in \`docs/design/VERIFY_LOG.md\`."
            echo
            if [ -f "$RUNNER_TEMP/run_checks.log" ]; then
              echo "### What the script printed"
              echo
              echo '```text'
              grep -E '^== |^Ran [0-9]+ tests|^OK|^FAILED|scenarios passed|^\(the stand-in engine|^NOTE' "$RUNNER_TEMP/run_checks.log" | cut -c1-200 || true
              echo '```'
            else
              echo "The script did not start; see the steps before it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
